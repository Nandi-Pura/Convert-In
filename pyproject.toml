[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "configmorph"
dynamic = ["version"]
description = "Open-source firewall configuration analysis, visualization, and migration workbench"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
readme = "README.md"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: System :: Networking",
]
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1", "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3", "alembic>=1.13,<2", "defusedxml>=0.7,<1",
  "networkx>=3.3,<4"
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]
browser = ["playwright>=1.48,<2", "pytest-playwright>=0.5,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.dynamic]
version = {attr = "app.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["browser: Playwright smoke tests", "pan_lab: opt-in isolated PAN-OS lab tests"]
