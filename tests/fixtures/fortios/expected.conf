config firewall address
    edit HOST
        set subnet 10.0.0.1 255.255.255.255
    next
    edit NET
        set subnet 10.0.1.0 255.255.255.0
    next
    edit RANGE
        set type iprange
        set start-ip 10.0.2.1
        set end-ip 10.0.2.9
    next
end
config firewall addrgrp
    edit ADDRS
        set member HOST NET RANGE
    next
end
config firewall service custom
    edit TCP_WEB
        set tcp-portrange 80 443-444
    next
    edit UDP_DNS
        set udp-portrange 53
    next
end
config firewall service group
    edit WEB_DNS
        set member TCP_WEB UDP_DNS
    next
end
config router static
    edit 1
        set dst 0.0.0.0 0.0.0.0
        set gateway 192.0.2.1
        set device port1
    next
end
config firewall policy
    edit 1
        set name ALLOW_WEB
        set srcintf port2
        set dstintf port1
        set srcaddr HOST
        set dstaddr NET
        set action accept
        set schedule always
        set service TCP_WEB
    next
    edit 2
        set name DENY_WEB
        set srcintf port2
        set dstintf port1
        set srcaddr ADDRS
        set dstaddr HOST
        set action deny
        set schedule always
        set service WEB_DNS
        set status disable
    next
end