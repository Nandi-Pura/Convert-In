name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Configure temporary runtime
        run: |
          echo "FCS_DATA_DIR=${{ runner.temp }}/convert-in-data" >> "$GITHUB_ENV"
          echo "FCS_WORKSPACE_DIR=${{ runner.temp }}/convert-in-workspace" >> "$GITHUB_ENV"
          mkdir -p "${{ runner.temp }}/convert-in-data" "${{ runner.temp }}/convert-in-workspace"
      - name: Compile Python
        run: python -m compileall -q app
      - name: Apply database migrations
        run: alembic upgrade head
      - name: Test
        run: pytest -q
      - name: Check JavaScript syntax
        run: node --check app/static/js/app.js
      - name: Realistic performance ceiling
        run: python tools/benchmark_realistic.py

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build
      - run: python -m pip install -e ".[test,browser]"
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q tests/browser